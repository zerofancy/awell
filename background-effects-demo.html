<header><div class="eyebrow">AWELL / BACKGROUND STUDIES</div><h1>让照片之外，也恰到好处。</h1><p>六种静态背景提案，同一张照片并排比较。前景保持完整比例；背景只负责衬托，不抢走主角。</p>
<div class="toolbar"><label class="upload">＋ 上传自己的照片<input id="upload" type="file" accept="image/*"></label><select id="sample" aria-label="切换示例图"><option value="photo">示例 · 山湖风景</option><option value="portrait">示例 · 竖幅裁切</option><option value="art">示例 · 暖色抽象插画</option></select><button id="baseline">对比现有模糊背景</button></div><div id="notice" role="status" aria-live="polite">正在准备示例照片…</div></header>
<main><section class="settings" aria-label="预览设置"><label class="range">背景亮度 <input id="brightness" type="range" min="35" max="100" value="76"><output id="brightnessValue">76%</output></label><label class="range">色彩浓度 <input id="saturation" type="range" min="0" max="140" value="75"><output id="saturationValue">75%</output></label><label class="check"><input id="shadow" type="checkbox" checked>前景轻投影</label><label class="check"><input id="desktop" type="checkbox" checked>桌面元素</label><label class="check"><input id="night" type="checkbox">夜间调暗</label><div class="swatches" id="swatches" aria-label="照片提取色"></div></section><section class="grid" id="grid" aria-label="六种背景效果"></section></main>
<footer>静态效果概念演示，非 Android 实际渲染。上传照片仅在本机内存中处理，不会发送到服务器；刷新后不保留。<br>示例风景：<a href="https://images.unsplash.com/photo-1470770841072-f978cf4d019e" target="_blank" rel="noreferrer">Unsplash 图片来源</a> · 点击任意卡片放大，可保存无桌面元素的预览 PNG。</footer>
<dialog id="detail"><button id="close" aria-label="关闭放大预览">✕</button><div style="clear:both"></div><div class="modal-layout"><canvas id="large" class="modal-canvas" width="600" height="1200"></canvas><div class="modal-copy"><div class="eyebrow">BACKGROUND PREVIEW</div><h2 id="detailTitle"></h2><p id="detailText"></p><div class="modal-actions"><button id="previous" aria-label="上一种效果">←</button><button id="next" aria-label="下一种效果">→</button><button class="primary" id="save">保存 PNG</button></div><p class="tip">左右方向键切换，Esc 关闭。<br>保存图片仅含背景与前景，不含时钟和图标。</p></div></div></dialog>

const effects=[
 {id:'gradient',name:'取色柔和渐变',tag:'首选 · 克制耐看',desc:'将照片的主色缓缓铺开，低饱和的渐变让留白与照片自然呼应。',detail:'适合日常长期使用。顶部与底部采用不同的照片衍生色，中间加入柔和过渡，不复制照片细节，也不打扰桌面图标。'},
 {id:'glow',name:'弥散光斑',tag:'柔和 · 空间层次',desc:'大面积柔光交叠，像磨砂玻璃背后的色彩，柔和但不单调。',detail:'以照片主色构成不对称的弥散光团。边缘没有清晰轮廓，照片上下的留白会有柔和明暗变化。适合偏梦幻、现代的风格。'},
 {id:'grain',name:'暗色微纹理',tag:'摄影 · 安静衬托',desc:'照片衍生的深色底，加入很轻的细颗粒，让主体成为唯一焦点。',detail:'背景从照片取色后明显压暗，再叠加低对比度颗粒。比纯黑更有质感，又保留深色背景的清晰度与克制感。'},
 {id:'edge',name:'照片边缘延展',tag:'自然 · 无缝衔接',desc:'只将照片边缘的色彩向外延伸，逐渐柔化，不重复整幅照片。',detail:'上方留白延展照片顶部，下方留白延展照片底部；竖幅照片的左右留白同理。相比整图模糊，不会在背景再次出现完整主体。'},
 {id:'paper',name:'相纸画框',tag:'相册 · 温暖质感',desc:'暖白或浅色纸张、窄边框和轻投影，像把照片放进一本相册。',detail:'用照片衍生的浅暖色作纸面，加入轻微纸纹与偏白的相纸边框。为容纳边框，照片会比其他方案略小；亮度控制影响纸面，不改变照片本身。'},
 {id:'polygon',name:'低多边形拼贴',tag:'几何 · 鲜明风格',desc:'用照片主色拼出大块三角形，比随机矩形更统一、更有设计感。',detail:'使用固定布局的大尺寸三角形，配色来自照片。降低明暗反差，避免密集几何线条抢走注意力。布局固定，调节参数时不会随机闪动。'}

const $=id=>document.getElementById(id);let image=null,original=null,colors=[[79,111,116],[142,160,140],[197,170,122],[173,183,164]],selected=0,uploadedURL=null;
const rgb=(c,a=1)=>`rgba(${c.map(v=>Math.round(v)).join(',')},${a})`;
const mix=(a,b,t)=>a.map((v,i)=>v*(1-t)+b[i]*t);
function adjusted(c){const sat=+$('saturation').value/100,l=.2126*c[0]+.7152*c[1]+.0722*c[2],b=+$('brightness').value/100;return c.map(v=>Math.max(0,Math.min(255,(l+(v-l)*sat)*b)));}
function random(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function layer(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function extract(img){const c=layer(56,56),x=c.getContext('2d',{willReadFrequently:true});x.drawImage(img,0,0,56,56);const d=x.getImageData(0,0,56,56).data,bins=new Map();for(let i=0;i<d.length;i+=4){if(d[i+3]<128)continue;const key=[d[i],d[i+1],d[i+2]].map(v=>v>>5).join(',');let b=bins.get(key);if(!b){b={n:0,sum:[0,0,0]};bins.set(key,b);}b.n++;for(let k=0;k<3;k++)b.sum[k]+=d[i+k];}const sorted=[...bins.values()].sort((a,b)=>b.n-a.n).map(b=>b.sum.map(v=>v/b.n));const result=[];for(const c of sorted){if(result.every(p=>p.reduce((s,v,i)=>s+(v-c[i])**2,0)>2300))result.push(c);if(result.length===4)break;}if(!result.length)result.push([90,110,105]);while(result.length<4)result.push(mix(result[0],[180,155,130],result.length/4));colors=result;$('swatches').replaceChildren(...colors.map(c=>{const s=document.createElement('span');s.className='swatch';s.style.background=rgb(c);s.title=c.map(Math.round).join(', ');return s;}));}
function fit(w,h,inset=0){const ratio=Math.min((w-inset*2)/image.width,(h-inset*2)/image.height);return {w:image.width*ratio,h:image.height*ratio,x:(w-image.width*ratio)/2,y:(h-image.height*ratio)/2};}
function cover(ctx,img,w,h,padding=0){const s=Math.max(w/img.width,h/img.height);ctx.drawImage(img,(w-img.width*s)/2-padding,(h-img.height*s)/2-padding,img.width*s+padding*2,img.height*s+padding*2);}
function noise(ctx,w,h,alpha,paper=false){const c=layer(160,320),x=c.getContext('2d'),d=x.createImageData(160,320),r=random(17);for(let i=0;i<d.data.length;i+=4){const v=paper?Math.round(100+r()*110):Math.round(r()*255);d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=alpha;}x.putImageData(d,0,0);ctx.save();ctx.imageSmoothingEnabled=false;ctx.drawImage(c,0,0,w,h);ctx.restore();}
function background(ctx,w,h,id,p){const cs=colors.map(adjusted);ctx.fillStyle='#101715';ctx.fillRect(0,0,w,h);
 if(id==='gradient'){const g=ctx.createLinearGradient(0,0,w*.75,h);g.addColorStop(0,rgb(mix(cs[0],[20,28,29],.22)));g.addColorStop(.48,rgb(cs[1]));g.addColorStop(1,rgb(mix(cs[2],[23,29,28],.35)));ctx.fillStyle=g;ctx.fillRect(0,0,w,h);const glow=ctx.createRadialGradient(w*.15,h*.2,0,w*.15,h*.2,w*1.1);glow.addColorStop(0,rgb(cs[3],.35));glow.addColorStop(1,rgb(cs[3],0));ctx.fillStyle=glow;ctx.fillRect(0,0,w,h);}
 else if(id==='glow'){ctx.fillStyle=rgb(mix(cs[0],[12,19,22],.72));ctx.fillRect(0,0,w,h);[[.04,.15,.95,0],[1.08,.39,1.05,2],[.3,.97,1.1,1],[.85,.83,.7,3]].forEach(([x,y,r,c])=>{const g=ctx.createRadialGradient(w*x,h*y,0,w*x,h*y,w*r);g.addColorStop(0,rgb(cs[c],.92));g.addColorStop(.42,rgb(cs[c],.45));g.addColorStop(1,rgb(cs[c],0));ctx.fillStyle=g;ctx.fillRect(0,0,w,h);});}
 else if(id==='grain'){const g=ctx.createLinearGradient(0,0,w,h);g.addColorStop(0,rgb(mix(cs[0],[12,15,17],.82)));g.addColorStop(1,rgb(mix(cs[2],[13,16,17],.9)));ctx.fillStyle=g;ctx.fillRect(0,0,w,h);noise(ctx,w,h,10);}
 else if(id==='edge'){const c=layer(w,h),x=c.getContext('2d');x.fillStyle=rgb(cs[0]);x.fillRect(0,0,w,h);x.drawImage(image,0,0,image.width,Math.max(1,image.height*.04),p.x,0,p.w,p.y+12);x.drawImage(image,0,image.height*.96,image.width,Math.max(1,image.height*.04),p.x,p.y+p.h-12,p.w,h-p.y-p.h+12);x.drawImage(image,0,0,Math.max(1,image.width*.04),image.height,0,0,p.x+12,h);x.drawImage(image,image.width*.96,0,Math.max(1,image.width*.04),image.height,p.x+p.w-12,0,w-p.x-p.w+12,h);x.drawImage(image,p.x,p.y,p.w,p.h);ctx.save();ctx.filter=`blur(${w*.05}px) saturate(${$('saturation').value}%) brightness(${$('brightness').value}%)`;ctx.drawImage(c,-w*.06,-h*.03,w*1.12,h*1.06);ctx.restore();}
 else if(id==='paper'){const base=mix(colors[2],[249,244,230],.9);const b=+$('brightness').value/100;ctx.fillStyle=rgb(base.map(v=>v*(.65+.35*b)));ctx.fillRect(0,0,w,h);noise(ctx,w,h,8,true);}
 else if(id==='polygon'){const r=random(123),cols=3,rows=6,points=[];for(let y=0;y<=rows;y++){const row=[];for(let x=0;x<=cols;x++)row.push([x*w/cols+(x&&x<cols?(r()-.5)*w*.2:0),y*h/rows+(y&&y<rows?(r()-.5)*h*.1:0)]);points.push(row);}for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){const a=points[y][x],b=points[y][x+1],c=points[y+1][x],d=points[y+1][x+1];const triangles=r()>.5?[[a,b,c],[b,d,c]]:[[a,b,d],[a,d,c]];triangles.forEach(t=>{ctx.beginPath();ctx.moveTo(...t[0]);ctx.lineTo(...t[1]);ctx.lineTo(...t[2]);ctx.closePath();const col=mix(cs[Math.floor(r()*cs.length)],cs[0],.35);ctx.fillStyle=rgb(col);ctx.strokeStyle=rgb(col);ctx.lineWidth=1;ctx.fill();ctx.stroke();});}}
 else if(id==='blur'){ctx.save();ctx.filter=`blur(${w*.045}px) saturate(${$('saturation').value}%) brightness(${$('brightness').value}%)`;cover(ctx,image,w,h,w*.08);ctx.restore();ctx.fillStyle='#0003';ctx.fillRect(0,0,w,h);}
}
function render(canvas,id,desktop=false){if(!image)return;const x=canvas.getContext('2d'),w=canvas.width,h=canvas.height,p=fit(w,h,id==='paper'?w*.07:0);x.clearRect(0,0,w,h);background(x,w,h,id,p);x.save();if($('shadow').checked){x.shadowColor='#0007';x.shadowBlur=w*.045;x.shadowOffsetY=w*.018;}if(id==='paper'){const pad=w*.022;x.fillStyle='#fcf9f1';x.fillRect(p.x-pad,p.y-pad,p.w+pad*2,p.h+pad*2+w*.025);x.shadowColor='transparent';}x.drawImage(image,p.x,p.y,p.w,p.h);x.restore();if($('night').checked){x.fillStyle='rgba(0,0,0,.30)';x.fillRect(0,0,w,h);}if(desktop&&$('desktop').checked)drawDesktop(x,w,h);}
function drawDesktop(x,w,h){x.save();x.fillStyle='white';x.textAlign='center';x.shadowColor='#0008';x.shadowBlur=6;x.font=`300 ${w*.145}px system-ui`;x.fillText('09:41',w/2,h*.19);x.font=`${w*.035}px system-ui`;x.fillText('11月26日 · 星期四',w/2,h*.22);['电话','照片','相机','设置'].forEach((name,i)=>{const a=w*(.13+i*.245),y=h*.85;x.fillStyle='#eaf5ed35';x.beginPath();x.roundRect(a-w*.055,y,w*.11,w*.11,w*.03);x.fill();x.fillStyle='white';x.font=`${w*.05}px system-ui`;x.fillText(['☎','▧','◎','⚙'][i],a,y+w*.075);x.font=`${w*.025}px system-ui`;x.fillText(name,a,y+w*.16);});x.restore();}
function drawAll(){document.querySelectorAll('.card canvas').forEach(c=>render(c,c.dataset.effect));document.querySelectorAll('.home').forEach(e=>e.classList.toggle('hidden',!$('desktop').checked));$('brightnessValue').value=$('brightness').value+'%';$('saturationValue').value=$('saturation').value+'%';if($('detail').open)renderLarge();}
function build(){effects.forEach((e,i)=>{const card=document.createElement('article');card.className='card';card.innerHTML=`<div class="card-head"><span class="number">0${i+1} / STUDY</span><span class="tag">${e.tag}</span></div><button class="phone" aria-label="放大预览：${e.name}"><canvas width="420" height="840" data-effect="${e.id}"></canvas><div class="status"><span>9:41</span><span class="signals">▴ ▰ ▰</span></div><span class="island"></span><div class="home"><div class="clock">09:41<div class="date">11月26日 · 星期四</div></div><div class="apps"><div class="app"><span class="icon">☎</span>电话</div><div class="app"><span class="icon">▧</span>照片</div><div class="app"><span class="icon">◎</span>相机</div><div class="app"><span class="icon">⚙</span>设置</div></div></div></button><h2>${e.name}</h2><p>${e.desc}</p>`;card.querySelector('button').onclick=()=>openDetail(i);$('grid').append(card);});}
function renderLarge(){const e=effects[selected]||{id:'blur',name:'现有 · 同图模糊背景',detail:'对照组：将完整照片等比铺满背景，模糊并压暗，再叠加清晰前景。这里使用浏览器模糊近似表现，不代表 Android 端的逐像素输出。'};$('detailTitle').textContent=e.name;$('detailText').textContent=e.detail;render($('large'),e.id,true);}
function openDetail(i){selected=i;renderLarge();$('detail').showModal();}function step(d){selected=(selected+d+7)%7;renderLarge();}
function load(src){return new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=reject;im.src=src;});}
async function useImage(im,message){image=im;extract(image);drawAll();$('notice').textContent=message;}
async function chooseSample(){try{if($('sample').value==='art'){const c=layer(760,950),x=c.getContext('2d');x.fillStyle='#e2b99b';x.fillRect(0,0,760,950);const g=x.createLinearGradient(0,0,0,950);g.addColorStop(0,'#e8c7a7');g.addColorStop(1,'#ae7771');x.fillStyle=g;x.fillRect(0,0,760,950);x.fillStyle='#e8d8b7';x.beginPath();x.arc(530,290,130,0,Math.PI*2);x.fill();[['#9c5558',570],['#655869',700],['#344c55',850]].forEach(([color,y],i)=>{x.fillStyle=color;x.beginPath();x.moveTo(0,y);x.bezierCurveTo(220,y-260,400,y+170,760,y-130);x.lineTo(760,950);x.lineTo(0,950);x.fill();});await useImage(await load(c.toDataURL()),'暖色抽象插画 · 用于观察不同配色与竖幅留白');}else if(original){if($('sample').value==='portrait'){const c=layer(620,930),x=c.getContext('2d');cover(x,original,620,930);await useImage(await load(c.toDataURL()),'竖幅裁切示例 · 与风景图同源，方便比较纵横比例');}else await useImage(original,'山湖风景示例 · 图片已内嵌，断网也可打开；上传照片仅本地处理');}}catch(e){$('notice').textContent='示例载入失败，请尝试上传自己的照片。';}}
$('upload').onchange=async event=>{const f=event.target.files[0];if(!f)return;const url=URL.createObjectURL(f);try{const im=await load(url);await useImage(im,'当前照片：'+f.name+' · 仅在本机处理，不会上传');if(uploadedURL)URL.revokeObjectURL(uploadedURL);uploadedURL=url;$('sample').selectedIndex=-1;}catch(e){URL.revokeObjectURL(url);$('notice').textContent='无法解码这张图片，请尝试 JPEG、PNG 或 WebP。';}event.target.value='';};
$('sample').onchange=chooseSample;['brightness','saturation','shadow','desktop','night'].forEach(id=>$(id).addEventListener('input',drawAll));$('baseline').onclick=()=>openDetail(6);$('close').onclick=()=>$('detail').close();$('previous').onclick=()=>step(-1);$('next').onclick=()=>step(1);$('detail').addEventListener('click',e=>{if(e.target===$('detail')){const r=$('detail').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$('detail').close();}});document.addEventListener('keydown',e=>{if(!$('detail').open)return;if(e.target instanceof HTMLInputElement)return;if(e.key==='ArrowLeft'){e.preventDefault();step(-1);}if(e.key==='ArrowRight'){e.preventDefault();step(1);}});$('save').onclick=()=>{const c=layer(600,1200);render(c,effects[selected]?.id||'blur');const a=document.createElement('a');a.download='awell-'+(effects[selected]?.id||'blur')+'.png';a.href=c.toDataURL('image/png');a.click();};
build();(async()=>{try{original=await load(PHOTO);await chooseSample();}catch(e){$('sample').value='art';await chooseSample();}})();
</script>
